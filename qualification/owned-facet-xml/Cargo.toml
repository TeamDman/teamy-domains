[package]
name = "teamy-domains-owned-xml-qualification"
version = "0.0.0"
edition = "2024"
publish = false

# Separate from the CLI workspace: these unpublished owned crates are local
# source inputs for qualification, not production registry dependencies.
[workspace]

[dependencies]
teamy-domains = { path = "../.." }
facet-xml-node = { package = "teamy-facet-xml-node", version = "=0.50.0-rc.7", path = "../../../facet-format-domains/facet-xml-node" }
facet-xml = { package = "teamy-facet-xml", version = "=0.50.0-rc.7", path = "../../../facet-format-domains/facet-xml" }
